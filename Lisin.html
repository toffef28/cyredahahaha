<!Doctype html>
<html>

<head>
    <title>SLAMBOOK!</title>
</head>
<link rel="stylesheet" href="slambook.css">
<body>
    <div class="form1"> 
    <form>
        <label>
            Name: <br>
            <input type="text" name="name" placeholder="Surname, Firstname"><br>
        </label>
        <label>
            Email: <br>
            <input type="email" name="email" placeholder="user@email.com"><br>
        </label>
        <label>
            Contact: <br>
            <input type="tel" name="Telephone Number" placeholder="(63+)xxx-xxx-xxxx"><br>
        </label>
        <label>
            Facebook link: <br>
            <input type="URL" name="Facebook URL" placeholder="https://www.facebook.com"><br>
        </label>
        <label>
            Search: <br>
            <input type="search" placeholder="Search here,  pare"></search> <br>
        </label>
        <label>
            Favoite Number: <br>
            <input type="number" min="0" max="20" value="20"> <br>
        </label>
        <label>
            Motto: <br>
            <textarea name="Motto" rows="3" placeholder="Write your Motto here"></textarea>
        </label>

        <fieldset>
            <legend>Preffered Snacks:</legend>
            <label>
                <input type="checkbox" name="snack" value="Chocolate">Chocolate
            </label><br>
            <label>
                <input type="checkbox" name="snack" value="Chips">Chips<br>
            </label>
            <label>
                <input type="checkbox" name="snack" value="Fruit">Fruit<br>
            </label>
            <label>
                <input type="checkbox" name="snack" value="Cookies">Cookies<br>
            </label>
        </fieldset><br>

        <fieldset> 
            <legend>Dream Vacation:</legend>
            <label>
                <input type="radio" name="Vacation" value="Beach">Beach<br>
            </label>
            <label>
                <input type="radio" name="Vacation" value="Mountains">Mountains<br>
            </label>
            <label>
                <input type="radio" name="Vacation" value="City">City<br>
            </label>
            <label>
                <input type="radio" name="Vacation" value="Countryside">Countryside<br>
            </label>
        </fieldset>     
        <fieldset>
            <legend>Preffered Music Genre:</legend>
            <select name="Music">
                <option value="Pop">Pop</option>
                <option value="Rock">Rock</option>
                <option value="Hip-hop">Hip-hop</option>
                <option value="Classical">Classical</option>
            </select> </div>
        </fieldset><br>
      <label>
            <button type="Submit">Submit</button>
            <button type="Reset">Reset</button>
        </label>
    </div>
</body>
</html>
